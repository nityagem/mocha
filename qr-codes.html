<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table QR Codes - Dhunki</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="qr-codes.css" rel="stylesheet">
</head>
<body>
    <h1>Table QR Codes</h1>
    <p class="subtitle">Print these and place them on the respective tables.</p>
    
    <div class="qr-grid" id="qr-container">
        <!-- QR codes will be injected here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('qr-container');
            const totalTables = 10;
            
            // Generate absolute base URL for the menu page
            // Assuming this page is hosted in the same directory as index.html
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/index.html';

            for (let i = 1; i <= totalTables; i++) {
                const card = document.createElement('div');
                card.className = 'qr-card';
                
                const title = document.createElement('h2');
                title.textContent = `Table ${i}`;
                
                const qrDiv = document.createElement('div');
                qrDiv.className = 'qr-code';
                
                const instruction = document.createElement('p');
                instruction.textContent = 'Scan to order';
                
                card.appendChild(title);
                card.appendChild(qrDiv);
                card.appendChild(instruction);
                container.appendChild(card);
                
                // The URL specific to this table
                const tableUrl = `${baseUrl}?table=${i}`;
                
                // Generate the QR code
                new QRCode(qrDiv, {
                    text: tableUrl,
                    width: 180,
                    height: 180,
                    colorDark : "#78350f",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }
        });
    </script>
</body>
</html>
